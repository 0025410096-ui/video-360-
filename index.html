<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tham Quan Hệ Sinh Thái Biển 360°</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        /* Nút bấm để kích hoạt quyền truy cập cảm biến trên iOS */
        #permission-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            background-color: #0077b6;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <button id="permission-btn">Bắt đầu trải nghiệm (Bật Cảm Biến)</button>

    <a-scene>
        <a-assets>
            <video id="sea-video" 
                   src="https://bitmovin-a.akamaihd.net/content/playhouse-vr/progressive.mp4" 
                   autoplay 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-entity>

        <a-videosphere src="#sea-video" rotation="0 -90 0"></a-videosphere>
    </a-scene>

    <script>
        const btn = document.getElementById('permission-btn');
        const video = document.getElementById('sea-video');

        // Hàm kích hoạt phát video và xin quyền cảm biến
        btn.addEventListener('click', function() {
            // Phát video (sửa lỗi trình duyệt chặn tự động phát có tiếng)
            video.play();

            // Xin quyền truy cập cảm biến đối với thiết bị iOS (iPhone/iPad)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            btn.style.display = 'none'; // Ẩn nút nếu thành công
                        } else {
                            alert('Bạn cần cấp quyền cảm biến để xoay được góc nhìn!');
                        }
                    })
                    .catch(console.error);
            } else {
                // Đối với Android, cảm biến thường tự động bật, chỉ cần ẩn nút
                btn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
